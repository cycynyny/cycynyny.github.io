<div id="visitor-counter" class="page__footer-copyright" style="margin-top: 8px;">
  Unique visitors today: <span id="visits-today">...</span> &nbsp;|&nbsp; Total unique visitors: <span id="visits-total">...</span>
</div>
<script>
(function () {
  var GC = "https://dryangchao.goatcounter.com";
  var today = new Date().toISOString().slice(0, 10);

  fetch(GC + "/counter/TOTAL.json?start=" + today + "&end=" + today)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById("visits-today").textContent = data.count;
    })
    .catch(function () {
      document.getElementById("visits-today").textContent = "N/A";
    });

  fetch(GC + "/counter/TOTAL.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById("visits-total").textContent = data.count;
    })
    .catch(function () {
      document.getElementById("visits-total").textContent = "N/A";
    });
})();
</script>
